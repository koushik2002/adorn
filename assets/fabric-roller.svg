<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Illustrative tightly woven taupe roller textile</title>
  <defs>
    <linearGradient id="taupe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bcb09a"/><stop offset=".43" stop-color="#ab9d85"/><stop offset="1" stop-color="#978b77"/></linearGradient>
    <linearGradient id="warp"><stop stop-color="#e5dcc8" stop-opacity=".8"/><stop offset=".48" stop-color="#cbbda2" stop-opacity=".32"/><stop offset="1" stop-color="#6b604c" stop-opacity=".42"/></linearGradient>
    <linearGradient id="weft" x2="0" y2="1"><stop stop-color="#e3d8c0" stop-opacity=".65"/><stop offset=".4" stop-color="#c3b498" stop-opacity=".24"/><stop offset="1" stop-color="#756951" stop-opacity=".43"/></linearGradient>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0h12v12H0z" fill="#b4a58a" fill-opacity=".15"/>
      <path d="M1 0h1.35v12H1z M4.25 0H5.6v12H4.25z M7.25 0H8.6v12H7.25z M10.3 0h1.35v12H10.3z" fill="url(#warp)"/>
      <path d="M0 1h12v1.35H0z M0 4.2h12v1.35H0z M0 7.25h12V8.6H0z M0 10.2h12v1.35H0z" fill="url(#weft)"/>
      <path d="M1 1h4.6v1.1H1z M7.25 7.25h4.4v1.1h-4.4z" fill="#e9dfc9" fill-opacity=".3"/>
      <path d="M7.3 1h1v4.5h-1z M1 7.3h1v4.4H1z" fill="#77674e" fill-opacity=".16"/>
      <path d="M0 .15h12 M0 6.15h12" stroke="#f4ead5" stroke-opacity=".11" stroke-width=".4"/>
    </pattern>
    <filter id="linen" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".65 .52" numOctaves="2" stitchTiles="stitch" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="yarn"><feGaussianBlur stdDeviation=".35"/></filter>
    <radialGradient id="light" cx=".25" cy=".15" r="1"><stop stop-color="#f4e9d1" stop-opacity=".16"/><stop offset="1" stop-color="#4e483c" stop-opacity=".09"/></radialGradient>
  </defs>
  <g filter="url(#linen)">
    <path d="M0 0h800v800H0z" fill="url(#taupe)"/>
    <path d="M0 0h800v800H0z" fill="url(#basket)"/>
    <path d="M0 69h800 M0 239h800 M0 438h800 M0 687h800" stroke="#e6d9bd" stroke-opacity=".15" stroke-width="1.3" filter="url(#yarn)"/>
    <path d="M111 0v800 M369 0v800 M617 0v800" stroke="#76674f" stroke-opacity=".09" stroke-width="1.15" filter="url(#yarn)"/>
  </g>
  <path d="M0 0h800v800H0z" fill="url(#light)"/>
</svg>
